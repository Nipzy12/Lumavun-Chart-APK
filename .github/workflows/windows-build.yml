name: Build LUMAVUN Windows EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-build.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test market data utilities
        run: npm test
      - name: Build installer and portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: LUMAVUN-Chart-Windows-EXE
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
