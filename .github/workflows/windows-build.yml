name: Build LUMAVUN Windows EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-build.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax validation
        run: npm run check:syntax
      - name: Test market, trading and AI utilities
        run: npm test
      - name: Test MT5 bridge with mocked broker API
        run: python -m unittest discover -s mt5_bridge/tests -p "test_*.py" -v
      - name: Electron window smoke test
        run: npm run test:ui
      - name: Upload UI smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LUMAVUN-Windows-UI-Smoke
          path: desktop/artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build installer and portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: LUMAVUN-Chart-Windows-EXE
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
